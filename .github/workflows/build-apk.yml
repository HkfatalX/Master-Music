name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android e aplicar ajustes
        run: |
          flutter create --org com.mastermusic --project-name master_music --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 tool/patch_android.py

      - name: Chave de assinatura estável (permite atualizar sobre a versão anterior)
        run: |
          mkdir -p ~/.android
          cp tool/signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Preparar arquivos
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk "out/MasterMusic-$V.apk"
          python3 tool/release_notes.py "$V" > out/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: MasterMusic-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Master Music ${{ env.VERSION }}
          body_path: out/notes.md
          files: out/MasterMusic-${{ env.VERSION }}.apk
