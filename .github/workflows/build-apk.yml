name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'style.css'
      - 'app.js'
      - 'spotify-callback.html'
      - 'manifest.webmanifest'
      - 'img/**'
      - 'README.md'
      - 'studio/**'
      - 'lite.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android e aplicar ajustes
        run: |
          flutter create --org com.mastermusic --project-name master_music --platforms=android /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 tool/patch_android.py

      - run: flutter pub get

      - name: Atualizar compileSdk de plugins antigos (flutter_appauth)
        run: |
          for f in $(find ~/.pub-cache/hosted -path '*flutter_appauth*/android/build.gradle*'); do
            sed -i -E 's/(compileSdk(Version)?[ =]+)[0-9]+/\1 36/' "$f"; grep -n compileSdk "$f" || true
          done
      - run: dart run flutter_launcher_icons
      - name: Analisar código
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Salvar log de erro na branch ci-logs
        if: failure()
        run: |
          mkdir -p /tmp/logs && tail -n 150 build.log > /tmp/logs/build.log; cp analyze.log /tmp/logs/ || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs && git rm -rf . -q && cp /tmp/logs/* . && git add *.log && git commit -qm "logs" && git push -f origin ci-logs

      - name: Mostrar assinatura do APK
        run: |
          echo "Chave esperada:"; keytool -list -keystore tool/signing/debug.keystore -storepass android | grep SHA

      - name: Preparar arquivos
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$V" >> $GITHUB_ENV
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk "out/MasterMusic-$V.apk"
          python3 tool/release_notes.py "$V" > out/notes.md

      - name: Compilar versão Lite
        shell: bash
        run: |
          set -o pipefail
          sed -i -E '/applicationId/ s/master_music"/master_music.lite"/' android/app/build.gradle*
          sed -i 's/android:label="Master Music"/android:label="Master Music Lite"/' android/app/src/main/AndroidManifest.xml
          grep -n applicationId android/app/build.gradle*
          cp assets/lite/logo.png assets/logo.png; cp assets/lite/logo_mark.png assets/logo_mark.png
          dart run flutter_launcher_icons -f flutter_launcher_icons-lite.yaml
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=LITE=true 2>&1 | tee build-lite.log
          cp build/app/outputs/flutter-apk/app-release.apk "out/MasterMusic-Lite-$VERSION.apk"

      - name: Compilar Master Music Studio
        shell: bash
        run: |
          set -o pipefail
          sed -i -E '/applicationId/ s/master_music\.lite"/master_music.studio"/' android/app/build.gradle*
          sed -i 's/android:label="Master Music Lite"/android:label="Master Music Studio"/' android/app/src/main/AndroidManifest.xml
          grep -n applicationId android/app/build.gradle*
          dart run flutter_launcher_icons -f flutter_launcher_icons-studio.yaml
          flutter build apk --release --target-platform android-arm,android-arm64 --target lib/studio_main.dart 2>&1 | tee build-studio.log
          cp build/app/outputs/flutter-apk/app-release.apk "out/MasterMusic-Studio-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MasterMusic-apk
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Master Music ${{ env.VERSION }}
          body_path: out/notes.md
          files: |
            out/MasterMusic-${{ env.VERSION }}.apk
            out/MasterMusic-Lite-${{ env.VERSION }}.apk
            out/MasterMusic-Studio-${{ env.VERSION }}.apk
