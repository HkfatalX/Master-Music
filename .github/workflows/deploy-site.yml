name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/changelog.json', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar o site
        run: |
          mkdir -p /tmp/sb && cd /tmp/sb && npm init -y >/dev/null && npm i @supabase/supabase-js@2.45.4
          cd "$GITHUB_WORKSPACE"
          mkdir -p site/vendor
          cp /tmp/sb/node_modules/@supabase/supabase-js/dist/umd/supabase.js site/vendor/supabase.js
          cp assets/changelog.json site/changelog.json
          cp site/index.html site/404.html
          touch site/.nojekyll
          node --check site/app.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
