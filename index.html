<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>(function(){var m=location.pathname.match(/^\/[^/]+\//);var b=/github\.io$/.test(location.hostname)&&m?m[0]:"/";document.write('<base href="'+b+'">');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0714">
<title>Master Music</title>
<meta name="description" content="Master Music — player de música moderno, gratuito e seguro. App Android e site conectados à mesma conta.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/logo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side" hidden></aside>
  <main id="main"><div id="view" tabindex="-1"><p style="padding:24px;text-align:center;color:#A79BC4">Carregando Master Music…</p></div></main>
</div>
<div id="player" hidden></div>
<nav id="tabs" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="none"></audio>
<noscript><p style="padding:24px">Ative o JavaScript para usar o Master Music.</p></noscript>
<script>(function(){function show(m){var v=document.getElementById("view");if(v&&/Carregando/.test(v.textContent))v.innerHTML="<p style=\"padding:24px\">Erro ao carregar: "+String(m).replace(/</g,"&lt;")+"</p>"}window.addEventListener("error",function(e){show(e.message)});window.addEventListener("unhandledrejection",function(e){show(e.reason&&e.reason.message||e.reason)})})()</script>
<script src="lite.js?v=2"></script>
<script src="app.js?v=2"></script>

</body>
</html>
