name: master_music
description: Master Music - player de música moderno, gratuito e seguro.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  http: ^1.2.2
  cached_network_image: ^3.4.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  flutter_appauth: ^8.0.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/changelog.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#4C1D95"
  adaptive_icon_foreground: assets/logo_fg.png
