<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Voltando para o Master Music…</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0714;color:#F5F3FF;font-family:system-ui,sans-serif;text-align:center;padding:24px}
img{width:96px;height:96px;border-radius:28px;box-shadow:0 14px 40px rgba(139,92,246,.5)}
a{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:16px;background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;font-weight:800;text-decoration:none}
p{color:#A79BC4}
</style>
</head>
<body>
<div>
  <img src="img/logo-192.png" alt="Master Music">
  <h2>Voltando para o Master Music…</h2>
  <p id="m">Se o app não abrir sozinho, toque no botão.</p>
  <a id="open" href="#">Abrir o Master Music</a>
</div>
<script>
(function () {
  var q = location.search || '';
  var intent = 'intent://spotify-callback' + q + '#Intent;scheme=mastermusic;package=com.mastermusic.master_music;end';
  var custom = 'mastermusic://spotify-callback' + q;
  var android = /Android/i.test(navigator.userAgent);
  var btn = document.getElementById('open');
  btn.href = android ? intent : custom;
  if (!q || q.indexOf('code=') < 0) { document.getElementById('m').textContent = 'Nenhum retorno do Spotify encontrado. Volte ao app e tente conectar de novo.'; }
  else { setTimeout(function () { location.href = android ? intent : custom; }, 200); }
})();
</script>
</body>
</html>
